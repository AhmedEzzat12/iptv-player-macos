# XcodeGen spec for the iPhone/iPad app. The macOS app is built by scripts/build-app.sh, not by this project.
#   cd iOS && xcodegen generate      → iOS/TunerIOS.xcodeproj (git-ignored; regenerate after editing this file)
# Shared code is compiled straight from ../Sources/Tuner (no copies); iOS-only code lives in iOS/Sources.
name: TunerIOS
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  Tuner:
    path: ..
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0

targets:
  TunerIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Licenses
        type: folder
      - path: ../Sources/Tuner
        group: Shared
        excludes:
          # macOS-only: app entry, AppKit event monitors, Sparkle, CGL renderer, ffmpeg-process bridge.
          - "App/TunerApp.swift"
          - "App/Updates/**"
          - "Views/Settings/SettingsShortcutsEditor.swift"
          - "Player/MPVVideoLayer.swift"
          - "Player/SlotVideoView.swift"
          - "Player/AirPlayBridge.swift"
          - "Views/Player/AirPlayButton.swift"
    dependencies:
      - package: Tuner
        product: TunerCore
      - package: MPVKit
        # LGPL build: the GPL one can't be distributed through the App Store.
        product: MPVKit
    info:
      path: Resources/Info.plist
      properties:
        # The App Store name ("Tuner" is taken there); the code and repo stay Tuner.
        CFBundleDisplayName: Antenna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        # IPTV servers mostly use plain HTTP and raw IPs. Only NSAllowsArbitraryLoads: adding
        # NSAllowsLocalNetworking or NSAllowsArbitraryLoadsForMedia makes iOS ignore it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Antenna connects to IPTV servers and media on your local network.
        UIFileSharingEnabled: true
        # Only standard HTTPS (and hashing): exempt, so App Store Connect skips the export-compliance questions.
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: Tuner
        PRODUCT_MODULE_NAME: TunerIOS
        PRODUCT_BUNDLE_IDENTIFIER: $(TUNER_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # mpv renders through OpenGL ES on purpose (iOS/Sources/Player/MPVVideoLayer.swift).
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -DGLES_SILENCE_DEPRECATION"
        # Apple's on-device language model is an optional extra for search (used behind availability checks).
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  # The Mac App Store app: the same Sources/Tuner as the GitHub Mac app (scripts/build-app.sh), sandboxed, without
  # Sparkle, recording or the AirPlay converter, with MPVKit's libmpv linked in (TUNER_APP_STORE; see
  # Sources/Tuner/Support/Distribution.swift and AppStore/Mac). Same bundle ID as the iPhone/iPad app, so the two are
  # one App Store product (Universal Purchase).
  TunerMac:
    type: application
    platform: macOS
    sources:
      - path: ../AppStore/Mac/Sources
      - path: ../AppStore/Mac/Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Licenses
        type: folder
      - path: ../Sources/Tuner
        group: Shared
        excludes:
          - "App/Updates/**"
    dependencies:
      - package: Tuner
        product: TunerCore
      # LGPL build, as on iPhone/iPad.
      - package: MPVKit
        product: MPVKit
      - sdk: OpenGL.framework
      - sdk: AVKit.framework
      - sdk: UserNotifications.framework
      - sdk: MediaPlayer.framework
      - sdk: WebKit.framework
    # App Sandbox, network access for IPTV servers, ~/Movies for downloads, and files/folders the user picks
    # (playlist files, the iCloud sync folder, kept with security-scoped bookmarks). XcodeGen writes the file, so
    # entitlements added to it by hand disappear: add them here. No allow-jit: MPVKit's LuaJIT doesn't use MAP_JIT
    # memory, so it wouldn't help; mpv's Lua scripts are switched off instead (MPVEngine.makeCore).
    entitlements:
      path: ../AppStore/Mac/Tuner.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.assets.movies.read-write: true
    info:
      path: ../AppStore/Mac/Info.plist
      properties:
        CFBundleDisplayName: Antenna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: "© 2026 Ahmed Ezzat"
        NSSupportsAutomaticGraphicsSwitching: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Antenna connects to IPTV servers and media on your local network.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Antenna
        PRODUCT_MODULE_NAME: Tuner
        PRODUCT_BUNDLE_IDENTIFIER: $(TUNER_BUNDLE_ID)
        SWIFT_VERSION: "5.0"
        OTHER_SWIFT_FLAGS: "$(inherited) -D TUNER_APP_STORE"
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  TunerMac:
    build:
      targets:
        TunerMac: all
    run:
      config: Debug
  TunerIOS:
    build:
      targets:
        TunerIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: Tuner/TunerCoreTests
