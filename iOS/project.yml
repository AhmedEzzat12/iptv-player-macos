# XcodeGen spec for the iPhone/iPad app. The macOS app is built by scripts/build-app.sh, not by this project.
#   cd iOS && xcodegen generate      → iOS/TunerIOS.xcodeproj (git-ignored; regenerate after editing this file)
# Shared code is compiled straight from ../Sources/Tuner (no copies); iOS-only code lives in iOS/Sources.
name: TunerIOS
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  Tuner:
    path: ..
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0

targets:
  TunerIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: ../Sources/Tuner
        group: Shared
        excludes:
          # macOS-only: app entry, AppKit event monitors, Sparkle, CGL renderer, ffmpeg-process bridge.
          - "App/TunerApp.swift"
          - "App/Updates/**"
          - "Views/Settings/SettingsShortcutsEditor.swift"
          - "Player/MPVVideoLayer.swift"
          - "Player/SlotVideoView.swift"
          - "Player/AirPlayBridge.swift"
          - "Views/Player/AirPlayButton.swift"
    dependencies:
      - package: Tuner
        product: TunerCore
      - package: MPVKit
        product: MPVKit-GPL
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Tuner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        # IPTV servers mostly use plain HTTP and raw IPs. Only NSAllowsArbitraryLoads: adding
        # NSAllowsLocalNetworking or NSAllowsArbitraryLoadsForMedia makes iOS ignore it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Tuner connects to IPTV servers and media on your local network.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: Tuner
        PRODUCT_MODULE_NAME: TunerIOS
        PRODUCT_BUNDLE_IDENTIFIER: $(TUNER_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # mpv renders through OpenGL ES on purpose (iOS/Sources/Player/MPVVideoLayer.swift).
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -DGLES_SILENCE_DEPRECATION"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

schemes:
  TunerIOS:
    build:
      targets:
        TunerIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: Tuner/TunerCoreTests
